apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-restore
  namespace: database
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: local-path

  bootstrap:
    recovery:
      source: origin
      # recoveryTarget:
      #   targetTime: "2026-11-24 12:00:00+00"

  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-store
          serverName: pg
